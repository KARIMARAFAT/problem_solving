const app = document.getElementById("app");
const bar = document.getElementById("progress");
const totalEl = document.getElementById("total");
const bestEl = document.getElementById("best");

let sec = null;          // current section index, null = menu
const correct = {};      // per section: Set of item indices answered correctly (score only goes up)
SECTIONS.forEach((_, s) => correct[s] = new Set());
let queue = [], pos = 0, roundWrong = [], answered = false;

function total(){ return sec === null ? 0 : SECTIONS[sec].items.length; }

function updateStats(){
  renderTabs();
  if(sec === null){
    totalEl.textContent = "اختار القسم";
    bestEl.textContent = "";
    bar.style.width = "0%";
    return;
  }
  const c = correct[sec].size, t = total();
  totalEl.textContent = SECTIONS[sec].name + " — الاسكور: " + c + " / " + t;
  bestEl.textContent = Math.round(c / t * 100) + "%";
  bar.style.width = (c / t * 100) + "%";
}

function renderTabs(){
  const box = document.getElementById('tabs');
  box.innerHTML = '';
  SECTIONS.forEach((s, i) => {
    const b = document.createElement('button');
    b.className = 'tab' + (sec === i ? ' active' : '');
    b.textContent = s.name;
    b.onclick = () => openSection(i);
    box.appendChild(b);
  });
  const o = document.createElement('button');
  o.className = 'tab total';
  o.textContent = 'النتيجة الإجمالية';
  o.onclick = showOverall;
  box.appendChild(o);
}
function overallStats(){
  let c = 0, t = 0;
  SECTIONS.forEach((s, i) => { c += correct[i].size; t += s.items.length; });
  return { c: c, t: t };
}
function allDone(){ return SECTIONS.every((s, i) => correct[i].size === s.items.length); }
function overallHTML(){
  const st = overallStats();
  const rows = SECTIONS.map((s, i) => '<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)"><span>' + s.name + '</span><span>' + correct[i].size + ' / ' + s.items.length + '</span></div>').join('');
  return '<div style="margin-top:14px">' + (allDone() ? '<p style="font-weight:700;color:var(--ok)">خلصت كل الأقسام!</p>' : '') + '<p>الاسكور الإجمالي</p><div class="score">' + st.c + ' / ' + st.t + '</div><p style="color:var(--muted)">' + Math.round(st.c / st.t * 100) + '%</p>' + rows + '</div>';
}
function showOverall(){
  sec = null;
  updateStats();
  app.innerHTML = '<div class="result">' + overallHTML() + '<div class="btns"><button class="ghost" onclick="showMenu()">القائمة الرئيسية</button></div></div>';
}
function showMenu(){
  sec = null;
  updateStats();
  app.innerHTML = '<div class="menu"></div>';
  const menu = app.querySelector(".menu");
  SECTIONS.forEach((s, i) => {
    const b = document.createElement("button");
    b.className = "primary";
    b.textContent = s.name + " (" + correct[i].size + " / " + s.items.length + ")";
    b.onclick = () => openSection(i);
    menu.appendChild(b);
  });
}

function openSection(i){
  sec = i;
  startRound(SECTIONS[i].items.map((_, k) => k));
}

function startRound(list){
  queue = list.slice();
  pos = 0;
  roundWrong = [];
  render();
}

function showResult(){
  const roundRight = queue.length - roundWrong.length;
  const wrongCount = roundWrong.length;
  const missing = total() - correct[sec].size;
  app.innerHTML =
    '<div class="result">' +
    '<p>نتيجة الجولة</p>' +
    '<div class="score">' + roundRight + ' / ' + queue.length + '</div>' +
    '<p style="color:var(--muted)">الاسكور الكلي للقسم: ' + correct[sec].size + ' / ' + total() + '</p>' +
    '<div class="btns"></div></div>';
  const box = app.querySelector(".btns");
  if(wrongCount > 0){
    const b = document.createElement("button");
    b.className = "primary";
    b.textContent = "إعادة الأسئلة الغلط (" + wrongCount + ")";
    b.onclick = () => startRound(roundWrong.slice());
    box.appendChild(b);
  }
  if(missing > 0){
    const b = document.createElement("button");
    b.className = wrongCount > 0 ? "ghost" : "primary";
    b.textContent = "إعادة القسم كامل";
    b.onclick = () => startRound(SECTIONS[sec].items.map((_, k) => k));
    box.appendChild(b);
  } else {
    const p = document.createElement("p");
    p.textContent = "ممتاز! جاوبت على كل أسئلة القسم صح.";
    box.appendChild(p);
  }
  const back = document.createElement("button");
  back.className = "ghost";
  back.textContent = "القائمة الرئيسية";
  back.onclick = showMenu;
  box.appendChild(back);
  const reset = document.createElement("button");
  reset.className = "ghost";
  reset.textContent = "صفّر اسكور القسم";
  reset.onclick = () => { correct[sec].clear(); startRound(SECTIONS[sec].items.map((_, k) => k)); };
  box.appendChild(reset);
  if(allDone()){ app.querySelector('.result').insertAdjacentHTML('beforeend', overallHTML()); }
  updateStats();
}

function render(){
  updateStats();
  if(pos >= queue.length){ showResult(); return; }
  answered = false;
  const qi = queue[pos];
  const item = SECTIONS[sec].items[qi];
  const options = item.t === "tf" ? ["True","False"] : item.o;
  const correctIdx = item.t === "tf" ? (item.a ? 0 : 1) : item.a;

  const wrap = document.createElement("div");
  wrap.innerHTML = '<div class="meta"><span>السؤال ' + (pos+1) + ' من ' + queue.length + '</span><span>' + (item.t === "tf" ? "True / False" : "Multiple Choice") + '</span></div>' +
    '<p class="q"></p><div class="opts"></div><div class="row"><span class="fb"></span><button class="primary" disabled>التالي</button></div>';
  wrap.querySelector(".q").textContent = item.q;
  const optsBox = wrap.querySelector(".opts");
  const fb = wrap.querySelector(".fb");
  const next = wrap.querySelector("button.primary");

  options.forEach((text, i) => {
    const b = document.createElement("button");
    b.className = "opt";
    b.textContent = (item.t === "mcq" ? String.fromCharCode(65+i) + ". " : "") + text;
    b.onclick = () => {
      if(answered) return;
      answered = true;
      const btns = optsBox.querySelectorAll("button");
      btns.forEach(x => x.disabled = true);
      if(i === correctIdx){
        b.classList.add("correct");
        correct[sec].add(qi);
        fb.textContent = "إجابة صحيحة"; fb.className = "fb ok";
      } else {
        b.classList.add("wrong");
        btns[correctIdx].classList.add("correct");
        if(!correct[sec].has(qi)) roundWrong.push(qi);
        fb.textContent = "إجابة خاطئة"; fb.className = "fb bad";
        if(item.e){ const ex = document.createElement("p"); ex.style.cssText = "direction:ltr;text-align:left;color:var(--muted);font-size:14px;margin:12px 0 0;line-height:1.6"; ex.textContent = "Explanation: " + item.e; wrap.appendChild(ex); }
      }
      updateStats();
      next.disabled = false;
    };
    optsBox.appendChild(b);
  });

  next.onclick = () => { pos++; render(); };
  app.innerHTML = "";
  app.appendChild(wrap);
}

showMenu();
</script>
</body>
</html>
