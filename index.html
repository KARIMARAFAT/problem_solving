{t:"mcq",q:"When identifying the “Who” in the initial descriptive phase of problem definition (Step 1), what should be the focus?",o:["Assigning personal blame to the employee who caused the error.","Identifying who detected the problem, NOT who caused it.","Determining which manager is financially responsible.","Evaluating the emotional intelligence of the team."],a:1},
{t:"mcq",q:"What is the primary operational objective of Root Cause Analysis (RCA)?",o:["To assign immediate blame to process operators.","To uncover the fundamental underlying causes of problems and direct effective corrective action.","To write complete C++ code for robot controllers.","To bypass solution evaluation and implement the first idea."],a:1},

{t:"mcq",q:"Why should a problem-solving group postpone selecting a single solution when generating ideas?",o:["To delay the project deadline indefinitely.","Because considering multiple alternatives significantly enhances the value of the final solution.","To avoid documenting preconditions and delete lists.","Because early decisions are legally non-binding."],a:1},
{t:"mcq",q:"In AI, how is Planning formally defined?",o:["The physical movement of robot joint actuators in 3D space.","The process of organizing pieces of knowledge into a consistent sequence of actions to accomplish a goal.","The direct execution of compiled Machine Code instructions.","The compilation of database tables into relational schema."],a:1},
{t:"mcq",q:"Why is traditional AI planning categorized as knowledge-intensive?",o:["It requires quantum computing hardware to function.","Plan creation requires organizing domain knowledge and partial plans into solution procedures.","It relies exclusively on unlabelled visual images.","It avoids using predicates or formal logic."],a:1},
{t:"mcq",q:"How are plans generated in a state space search context?",o:["By randomly executing operations until a system crash occurs.","By searching through a space of possible actions that change world states until a path to the goal state is discovered.","By hardcoding explicit paths for every possible world configuration.","By calculating the probability of human error in manufacturing."],a:1},

{t:"mcq",q:"What is the explicit meaning of the Delete List (D) in a STRIPS operator?",o:["The list of software bugs to be erased from memory.","The items or predicates that are removed from a state description when the operator is applied.","The list of illegal moves that the robot must never attempt.","The hardware components disabled during planning."],a:1},
{t:"mcq",q:"In the Blocks World domain, what condition must hold for a block W before 'pickup(W)' can be executed?",o:["W must have another block resting on top of it.","W must be clear on top, the gripper must be empty, and W must be on the table.","The robot gripper must already be holding another block V.","W must be at coordinate (0, 0, 0)."],a:1},

{t:"mcq",q:"What is included in the Add List (A) of the 'putdown(X)' operator?",o:["gripping(X)","ontable(X) ∧ gripping() ∧ clear(X)","on(X, Y) ∧ clear(Y)","location(X, Y, Z)"],a:1},

{t:"mcq",q:"What does the predicate 'clear(X)' formally signify in the Blocks World?",o:["Block X is completely transparent.","Block X has no block resting on top of it.","Block X is sitting on the tabletop surface.","Block X has been deleted from memory."],a:1},
{t:"mcq",q:"What is the Decision-Making Process?",o:["An informal guess made under extreme time constraints.","A systematic approach to choosing a course of action among multiple alternatives based on evaluation criteria.","The execution of search algorithms in AI software.","A method limited strictly to financial budgeting."],a:1},
{t:"mcq",q:"Which skill is common to BOTH Decision-Making and Problem-Solving skill sets?",o:["Critical Thinking","Heuristic Graph Search","Database Normalization","Micro-level Actuator Design"],a:0},
{t:"mcq",q:"What is the final step in the sequential Decision-Making Process?",o:["Take Action","Weigh the Evidence","Review the Decision and Its Consequences","Identify Alternatives"],a:2},
{t:"mcq",q:"What is the final step in the sequential Problem-Solving Process?",o:["Implement the Solution","Reflect and Learn","Generate Possible Solutions","Analyze the Problem"],a:1},
{t:"mcq",q:"Why are human factors considered during solution implementation planning?",o:["Because new procedures may be difficult to remember and people may feel threatened by change.","To calculate the speed of the robot gripper.","To satisfy STRIPS predicate logic assertions.","Because human factors eliminate the need for contingency planning."],a:0},
{t:"tf",q:"A good Problem Statement should focus primarily on describing surface symptoms rather than the root cause of an issue.",a:false,e:"Problem statements must focus on root causes, not surface symptoms."},
{t:"tf",q:"Answering the “Who” question in problem definition requires identifying the specific individual who caused the error so they can be disciplined.",a:false,e:"“Who” focuses on detection or affected parties, explicitly excluding blame."},
{t:"tf",q:"Qualitative and quantitative data should both be collected and analyzed when defining a problem.",a:true,e:"Both qualitative and quantitative data are required."},
{t:"tf",q:"Gemba review refers to documenting processes by reviewing theoretical user manuals away from the physical workspace.",a:false,e:"Gemba means going to the actual physical workspace."},
{t:"tf",q:"The 5 Whys technique is used during the solution implementation stage to track action item completion dates.",a:false,e:"5 Whys is a Root Cause Analysis tool used in diagnosis."},
{t:"tf",q:"Combining two average solutions into a hybrid solution can often yield an innovative and superior outcome.",a:true,e:"Combining options often creates superior hybrid solutions."},
{t:"tf",q:"Traditional AI planning relies minimally on domain knowledge and operates entirely via random brute-force generation.",a:false,e:"Planning is highly knowledge-intensive."},
{t:"tf",q:"Atomic actions of a robot can be defined at both micro-levels and higher abstraction levels.",a:true,e:"Atomic actions can exist at micro or macro abstraction levels."},
{t:"tf",q:"Search in planning terminates as soon as any action is executed, regardless of whether the goal state is reached.",a:false,e:"Search terminates specifically when the goal state is reached."},
{t:"tf",q:"A∗ search algorithms and heuristic search concepts are directly applicable to AI planning problems.",a:true,e:"A* search is directly applicable to planning state spaces."},
{t:"tf",q:"In STRIPS, the Add List specifies state predicates that must be removed after executing an operator.",a:false,e:"The Add List contains added predicates; the Delete List contains removed ones."},
{t:"tf",q:"The precondition for 'putdown(X)' requires that the robot hand is empty 'gripping()'.",a:false,e:"The precondition for putdown(X) requires gripping(X)."},
{t:"tf",q:"Executing 'stack(X, Y)' results in 'clear(Y)' being added to the current world state.",a:false,e:"clear(Y) is deleted because Y becomes covered by X."},
{t:"tf",q:"The predicate 'ontable(W)' indicates that block W is resting directly on the tabletop surface.",a:true,e:"ontable(W) asserts that W rests on the table surface."},
{t:"tf",q:"Decision-making and problem-solving refer to the exact same process with identical sequential steps.",a:false,e:"Decision-making (choosing) and problem-solving (resolving) are distinct processes."}
]},

{t:"mcq",q:"Which stakeholder group is responsible for overseeing strategic decisions, setting policy, and ensuring adherence to long-term goals?",o:["Lenders","Company leadership","Board of directors","Regulators"],a:2},
{t:"mcq",q:"Why are First Nations groups considered primary external stakeholders for certain organizations?",o:["Because they purchase the majority of the organization’s goods","Because they hold cultural significance over lands or waterways impacted by operations","Because they provide the financial loans necessary to run the project","Because they set the environmental laws for the local government"],a:1},
{t:"mcq",q:"Which of the following best describes the role of Regulators and governmental bodies as stakeholders?",o:["They create demand for products and services.","They provide financial resources to grow and innovate.","They advocate for employees’ rights and working conditions.","They monitor compliance with legal standards and safety protocols."],a:3},
{t:"mcq",q:"Customers, suppliers, and media groups are all categorized as:",o:["Primary Internal Stakeholders","Secondary External Stakeholders","Primary External Stakeholders","Secondary Internal Stakeholders"],a:1},
{t:"mcq",q:"What is the primary difference between a shareholder and a stakeholder?",o:["Shareholders only care about environmental impact, whereas stakeholders care about profits.","Stakeholders own equity in the company, while shareholders do not.","Shareholders own shares and focus on financial returns, while stakeholders include anyone affected by the company’s activities.","There is no difference; the terms are legally interchangeable."],a:2},
{t:"mcq",q:"Which type of shareholder receives fixed-rate dividends and is prioritized during company liquidation?",o:["Common Shareholders","Promoters","Retail Investors","Preferred Shareholders"],a:3},
{t:"mcq",q:"A shareholder who owns more than 50% of a company’s shares and can heavily influence major decisions is known as a:",o:["Minority Shareholder","Majority Shareholder","Institutional Investor","Retail Investor"],a:1},
{t:"mcq",q:"In the context of India’s shareholding structure, founders or controlling groups are specifically referred to as:",o:["Promoters","Retail Investors","Preferred Shareholders","Trade Unions"],a:0},
{t:"mcq",q:"If a business goes bankrupt, who is typically prioritized for debt repayment before shareholders receive remaining assets?",o:["New investors","Board of directors","Stakeholders such as creditors, lenders, and employees","Local community members"],a:2},
{t:"mcq",q:"Under India’s Companies Act, 2013, which section allows shareholders to file class action suits before the National Company Law Tribunal?",o:["Section 178","Sections 101-107","Sections 241, 245","Section 123"],a:2},
{t:"mcq",q:"According to the text, how do stakeholders typically exert influence on a company, as opposed to shareholders?",o:["Through direct voting rights in shareholder meetings","By electing the Board of Directors","Through indirect influence via business relationships, regulations, or public opinion","By dictating dividend payouts"],a:2},
{t:"mcq",q:"What mechanism does the India’s Companies Act, 2013 use to ensure transparency for stakeholders in large firms, despite them having no direct voting rights?",o:["National Company Law Tribunals","Stakeholder Relationship Committees (Section 178)","Preferred Stock Dividends","Retail Investment Accounts"],a:1},
{t:"mcq",q:"How does analyzing stakeholder positioning help organizations understand ”influence”?",o:["It identifies how much money each stakeholder makes.","It helps organizations understand the direction of influence, such as an executive’s upward influence on investors and downward influence on employees.","It allows the organization to completely remove stakeholders with negative influence.","It guarantees that all stakeholders have equal voting rights in board meetings."],a:1},
{t:"mcq",q:"What is the CORRECT four-step order for the stakeholder identification process?",o:["1. Identify all stakeholders, 2. Determine criteria, 3. Analyze stakeholders, 4. Categorize and rank","1. Analyze stakeholders, 2. Identify all stakeholders, 3. Categorize and rank, 4. Determine criteria","1. Determine criteria, 2. Categorize and rank, 3. Identify all stakeholders, 4. Analyze stakeholders","1. Categorize and rank, 2. Determine criteria, 3. Analyze stakeholders, 4. Identify all stakeholders"],a:0},
{t:"mcq",q:"Which specific software tool is mentioned in the text for visually categorizing and streamlining stakeholder management?",o:["Accrete AI","Nebula ITSM","Simply Stakeholders","DBS Treasures"],a:2},
{t:"mcq",q:"Which group acts as a ”watchdog” ensuring fair labor practices within an organization?",o:["Investors","Lenders","Trade unions","Customers"],a:2},
{t:"mcq",q:"According to the text, why might shareholders favor Corporate Social Responsibility (CSR) initiatives?",o:["Because it gives them priority during a bankruptcy","Because it enhances company reputation, profitability, and reduces regulatory risk","Because it automatically increases their voting power under the Companies Act","Because it eliminates the need to pay dividends"],a:1},
{t:"mcq",q:"Which group relies on a business’s success because disruptions can directly affect their ability to meet customer needs?",o:["Promoters","Regulators","Media groups","Suppliers and vendors"],a:3},
{t:"mcq",q:"A local environmental Non-Profit Organization (NPO) monitoring a company’s emissions acts in an advisory and oversight role. What type of stakeholder are they?",o:["Primary Internal Stakeholder","Secondary External Stakeholder (Interest Group)","Common Shareholder","Insider Shareholder"],a:1},
{t:"mcq",q:"Pension funds and insurance companies that purchase company equity are categorized as:",o:["Institutional Investors","Retail Investors","Promoters","Minority Shareholders"],a:0},
{t:"mcq",q:"What is a key characteristic of Common Shareholders?",o:["They have no voting rights whatsoever.","They receive their dividends before anyone else.","They have voting rights on major decisions like electing directors.","They are exempt from all financial risks if the company fails."],a:2},
{t:"mcq",q:"An individual purchasing a few shares of a company for personal financial growth is classified as a:",o:["Promoter","Retail Investor","Majority Shareholder","Institutional Investor"],a:1},
{t:"mcq",q:"Which of the following is NOT an example of a stakeholder’s primary interest?",o:["Product quality","Employment stability","Direct equity ownership and maximum dividend payout","Business continuity and economic opportunity"],a:2},
{t:"mcq",q:"Why is communication a crucial outcome of stakeholder analysis?",o:["It allows companies to send the exact same email to every individual involved.","It helps tailor communication strategies to the specific channels and media each group prefers, boosting engagement.","It is legally mandated by Section 47 of the Companies Act, 2013 for all stakeholders.","It prevents secondary stakeholders from discovering the company’s financial status."],a:1}
]},
{
name: "CS413 S3 — Theory (Midterm)",
items: [
{t:"mcq",q:"Which formula gives the average waiting time in a queueing simulation?",o:["total time customers wait in queue / total number of customers","total time customers wait in queue / number of customers who wait","total time customers spend in system / total number of customers","total idle time of server / total run time"],a:0},
{t:"mcq",q:"Which formula gives the probability that a customer has to wait?",o:["number of customers who wait / total number of customers","total waiting time / number of customers who wait","total idle time / total run time","number of customers who wait / total run time"],a:0},
{t:"mcq",q:"Which formula gives the probability of an idle server?",o:["total idle time of server / total run time of simulation","total idle time of server / total number of customers","total service time / total run time of simulation","total run time / total idle time of server"],a:0},
{t:"mcq",q:"Which formula gives the average service time?",o:["total service time / total number of customers","total service time / number of customers who wait","total run time / total number of customers","total service time / total run time"],a:0},
{t:"mcq",q:"The expected service time E(S) is computed as:",o:["sum of s · p(s) over all service times s","sum of p(s) divided by s","the largest service time","the average of the service times in one simulation"],a:0},
{t:"mcq",q:"The average time between arrivals is computed as:",o:["sum of all times between arrivals / (number of arrivals − 1)","sum of all times between arrivals / number of arrivals","total run time / number of arrivals","sum of arrival clock times / number of arrivals"],a:0},
{t:"mcq",q:"For a discrete uniform interarrival distribution from a to b, the expected value E(A) equals:",o:["(a + b) / 2","(a + b) / (b − a)","a × b","(b − a) / 2"],a:0},
{t:"mcq",q:"For interarrival times uniform from 1 to 8, E(A) equals:",o:["3.5","4","4.5","5"],a:2},
{t:"mcq",q:"The average waiting time of those who wait is computed as:",o:["total waiting time in queue / number of customers who wait","total waiting time in queue / total number of customers","total time in system / number of customers who wait","total service time / number of customers who wait"],a:0},
{t:"mcq",q:"Which relationship must hold between the average time in system, average waiting time, and average service time?",o:["average time in system = average waiting time in queue + average service time","average time in system = average waiting time in queue − average service time","average time in system = average waiting time in queue × average service time","average time in system = average service time / average waiting time in queue"],a:0},
{t:"mcq",q:"The total run time of a simulation is the clock time when:",o:["the first customer arrives","the last customer's service ends","the server becomes idle for the first time","the last customer arrives"],a:1},
{t:"mcq",q:"For a customer, the time in queue (waiting time) is computed as:",o:["service time begins − arrival time","service time ends − arrival time","service time ends − service time begins","arrival time − previous service ends"],a:0},
{t:"mcq",q:"For a customer, the time spent in the system is computed as:",o:["service time ends − arrival time","service time begins − arrival time","service time ends − service time begins","arrival time − previous arrival time"],a:0},
{t:"mcq",q:"For a customer, the service time ends clock is computed as:",o:["service time begins + service time","arrival time + service time","previous service ends + interarrival time","arrival time − service time"],a:0},
{t:"mcq",q:"The arrival time (clock) of a customer is computed as:",o:["previous arrival time + interarrival time","previous service ends + service time","service begins + interarrival time","interarrival time only"],a:0},
{t:"mcq",q:"The idle time of the server before a customer begins service is computed as:",o:["service time begins − previous service ends","arrival time − service time","service ends − service begins","previous service begins − arrival time"],a:0},
{t:"mcq",q:"In a 20-customer run, the total waiting time in queue was 56 minutes. The average waiting time per customer is:",o:["1.74 min","2.8 min","3.4 min","6.2 min"],a:1,e:"56 / 20 = 2.8 minutes."},
{t:"mcq",q:"In the 20-customer run, 13 customers waited. The probability that a customer has to wait is:",o:["0.21","0.46","0.65","0.24"],a:2,e:"13 / 20 = 0.65."},
{t:"mcq",q:"In the 20-customer run, the probability of an idle server is:",o:["0.21","0.24","0.65","0.59"],a:0,e:"18 / 86 ≈ 0.21."},
{t:"mcq",q:"The theoretical expected service time E(S) for the given service-time distribution is:",o:["2.8","3.2","3.4","4.5"],a:1,e:"1(0.10)+2(0.20)+3(0.30)+4(0.25)+5(0.10)+6(0.05) = 3.2."},
{t:"mcq",q:"In the 20-customer run, the average time between arrivals is:",o:["4.3 min","4.5 min","3.4 min","6.2 min"],a:0,e:"82 / 19 ≈ 4.3 minutes."},
{t:"mcq",q:"In the 20-customer run, the average waiting time of those who wait is:",o:["2.8 min","3.2 min","4.3 min","6.2 min"],a:2,e:"56 / 13 ≈ 4.3 minutes."},
{t:"mcq",q:"In the 20-customer run, the average time a customer spends in the system is:",o:["2.8 min","3.4 min","4.3 min","6.2 min"],a:3,e:"124 / 20 = 6.2 minutes."},
{t:"mcq",q:"In the 100-customer run, the average waiting time is:",o:["1.32 min","1.74 min","3.17 min","4.91 min"],a:1,e:"174 / 100 = 1.74 minutes."},
{t:"mcq",q:"In the 100-customer run, the probability that a customer has to wait is:",o:["0.24","0.46","0.54","0.65"],a:1,e:"46 / 100 = 0.46."},
{t:"mcq",q:"In the 100-customer run, the proportion of server idle time is:",o:["0.21","0.24","0.46","0.59"],a:1,e:"101 / 418 ≈ 0.24."},
{t:"mcq",q:"In the 100-customer run, the average waiting time of those who wait is:",o:["1.74 min","3.22 min","4.19 min","4.91 min"],a:1,e:"174 / 54 ≈ 3.22 minutes."},
{t:"mcq",q:"In the 100-customer run, the average time between arrivals (observed) is:",o:["4.19 min","4.5 min","3.17 min","4.91 min"],a:0,e:"415 / 99 ≈ 4.19 minutes. The expected value E(A) is 4.5."},
{t:"mcq",q:"In the 100-customer run, the average time a customer spends in the system is:",o:["1.74 min","3.17 min","4.91 min","6.2 min"],a:2,e:"491 / 100 = 4.91 minutes."},
{t:"mcq",q:"In the 100-customer run, the observed average service time is:",o:["3.17 min","3.2 min","3.4 min","4.91 min"],a:0,e:"317 / 100 = 3.17 minutes. E(S) = 3.2."},
{t:"mcq",q:"Why might 100 customers be too small a sample size to draw reliable conclusions?",o:["Because the simulation runs too fast","Because increasing sample size or running multiple replications can enhance accuracy","Because service times are always integers","Because the server is never idle"],a:1},
{t:"mcq",q:"Why does the grocery simulation start with an empty system?",o:["It is always the realistic starting condition.","It keeps calculations simple, while concerns about initial conditions are overlooked.","It is required by queueing theory.","Simulations cannot start with customers."],a:1},
{t:"mcq",q:"In the 50-trial experiment, what does each trial represent?",o:["One customer","One day (one run of 100 customers)","One minute","One server"],a:1},
{t:"mcq",q:"The overall average waiting time over the 50 trials was:",o:["1.32 min","1.74 min","3.22 min","0.46 min"],a:0},
{t:"mcq",q:"In the histogram of individual customer waiting times, how many customers fall in the interval (0, 2]?",o:["54","14","20","8"],a:1},
{t:"mcq",q:"In the histogram of individual customer waiting times, the bin with the highest occurrences is:",o:["Bin 0","Bin 2","Bin 4","Bin 6"],a:0,e:"54 customers had zero waiting time."},
{t:"mcq",q:"In the histogram of average waiting times over 50 trials, the most frequent bin is:",o:["(0.5, 1]","(1, 1.5]","(1.5, 2]","(2, 2.5]"],a:1,e:"22 trials fall in (1, 1.5]."},
{t:"mcq",q:"How many trials had an average waiting time in the interval (1.5, 2]?",o:["10","22","15","1"],a:2},
{t:"mcq",q:"The cumulative probability table is used in simulation to:",o:["compute averages directly","generate random values that follow the given distribution","calculate idle time only","compute queue length only"],a:1},
{t:"mcq",q:"In the service-time table, which service time is the most probable?",o:["2 minutes","3 minutes","4 minutes","5 minutes"],a:1,e:"Probability of 3 minutes is 0.30, the highest."},
{t:"mcq",q:"The cumulative probability that the service time is at most 3 minutes is:",o:["0.30","0.60","0.85","0.10"],a:1,e:"0.10 + 0.20 + 0.30 = 0.60."},
{t:"mcq",q:"The probability of each interarrival value (1 to 8 minutes) in the grocery example is:",o:["0.10","0.125","0.20","0.25"],a:1,e:"Discrete uniform: 1/8 = 0.125."},
{t:"tf",q:"The average waiting time is computed by dividing the total waiting time by the number of customers who waited.",a:false,e:"It is divided by the total number of customers. The 'who wait' version is a separate measure."},
{t:"tf",q:"The probability of an idle server equals total idle time divided by total run time of the simulation.",a:true},
{t:"tf",q:"The average time a customer spends in the system equals average waiting time in queue plus average time in service.",a:true},
{t:"tf",q:"In the 20-customer run, the average service time (3.4 min) equals the theoretical expected service time (3.2 min).",a:false,e:"They are close but not equal. The simulation approaches the theoretical mean as runs get longer."},
{t:"tf",q:"Increasing the number of customers or running multiple replications may improve the accuracy of results.",a:true},
{t:"tf",q:"The grocery simulation in the slides starts with customers already waiting in the queue.",a:false,e:"It starts with an empty grocery."},
{t:"tf",q:"For 100 customers, the average time between arrivals is computed by dividing by 100.",a:false,e:"It is divided by the number of arrivals minus 1, which is 99."},
{t:"tf",q:"The average waiting time of customers who wait is always greater than or equal to the overall average waiting time.",a:true,e:"The overall average includes customers with zero wait, so it is lower."},
{t:"tf",q:"The idle time of the server before a customer starts service occurs only when the customer arrives after the previous service has ended.",a:true},
{t:"tf",q:"The total run time of a simulation equals the clock time when the last customer's service ends.",a:true},
{t:"tf",q:"The histogram bin (0, 2] includes waiting times up to and including 2 minutes.",a:true},
{t:"tf",q:"The observed average service time from a simulation always equals E(S) exactly.",a:false,e:"Observed values vary; they approach E(S) as the simulation gets longer."},
{t:"tf",q:"The average time between arrivals in a short run always equals E(A) exactly.",a:false,e:"Observed values vary; they approach E(A) as the run gets longer."},
{t:"tf",q:"The average time a customer spends in the system is always less than the average waiting time in queue.",a:false,e:"Time in system = waiting time + service time, so it is always larger."}
]},

const ICONS=["📘","📝","🧠","📊","⚙️","🧪","🎯","🧩","🗂️","⏱️","📚","🏆"];
const app=document.getElementById("app");
const bar=document.getElementById("progress");
const totalEl=document.getElementById("total");
const bestEl=document.getElementById("best");

let sec=null;
const correct={};
SECTIONS.forEach((_,s)=>correct[s]=new Set());
let queue=[],pos=0,roundWrong=[],answered=false;

function total(){return sec===null?0:SECTIONS[sec].items.length;}

function updateStats(){
  renderTabs();
  if(sec===null){
    totalEl.textContent="اختار القسم";
    bestEl.textContent="";
    bar.style.width="0%";
    return;
  }
  const c=correct[sec].size,t=total();
  totalEl.textContent=SECTIONS[sec].name+" — الاسكور: "+c+" / "+t;
  bestEl.textContent=Math.round(c/t*100)+"%";
  bar.style.width=(c/t*100)+"%";
}

function renderTabs(){
  const box=document.getElementById("tabs");
  box.innerHTML="";
  SECTIONS.forEach((s,i)=>{
    const b=document.createElement("button");
    b.className="tab"+(sec===i?" active":"");
    b.textContent=ICONS[i%ICONS.length]+" "+s.name;
    b.onclick=()=>openSection(i);
    box.appendChild(b);
  });
  const o=document.createElement("button");
  o.className="tab total";
  o.textContent="🏁 النتيجة الإجمالية";
  o.onclick=showOverall;
  box.appendChild(o);
}

function overallStats(){
  let c=0,t=0;
  SECTIONS.forEach((s,i)=>{c+=correct[i].size;t+=s.items.length;});
  return {c,t};
}
function allDone(){return SECTIONS.every((s,i)=>correct[i].size===s.items.length);}

function overallHTML(){
  const st=overallStats(),p=Math.round(st.c/st.t*100);
  const rows=SECTIONS.map((s,i)=>'<div class="orow"><span>'+ICONS[i%ICONS.length]+" "+s.name+'</span><span>'+correct[i].size+' / '+s.items.length+'</span></div>').join("");
  return '<div class="ovr">'+(allDone()?'<p class="done">🏆 خلصت كل الأقسام!</p>':"")+
    '<p class="lbl">الاسكور الإجمالي</p>'+
    '<div class="ring" style="--p:'+p+'"><div class="in"><span>'+st.c+' / '+st.t+'</span><small>'+p+'%</small></div></div>'+rows+'</div>';
}

function showOverall(){
  sec=null;
  updateStats();
  app.innerHTML='<div class="result">'+overallHTML()+'<div class="btns"><button class="ghost" onclick="showMenu()">القائمة الرئيسية</button></div></div>';
}

function showMenu(){
  sec=null;
  updateStats();
  app.innerHTML='<div class="menu"></div>';
  const menu=app.querySelector(".menu");
  SECTIONS.forEach((s,i)=>{
    const c=correct[i].size,t=s.items.length,p=Math.round(c/t*100);
    const b=document.createElement("button");
    b.className="secCard";
    b.style.setProperty("--i",i);
    b.innerHTML='<span class="secIcon">'+ICONS[i%ICONS.length]+'</span><span class="secBody"><span class="secName"></span><span class="secMini"><span class="secFill" style="width:'+p+'%"></span></span><span class="secNum">'+c+' / '+t+' • '+p+'%</span></span>';
    b.querySelector(".secName").textContent=s.name;
    b.onclick=()=>openSection(i);
    menu.appendChild(b);
  });
}

function openSection(i){
  sec=i;
  startRound(SECTIONS[i].items.map((_,k)=>k));
}

function startRound(list){
  queue=list.slice();
  pos=0;
  roundWrong=[];
  render();
}

function confetti(){
  const colors=["#4f6ef7","#8e5cf6","#16a34a","#f5b642","#e5484d","#22d3ee"];
  for(let i=0;i<70;i++){
    const d=document.createElement("i");
    d.className="conf";
    d.style.left=(Math.random()*100)+"vw";
    d.style.background=colors[i%colors.length];
    d.style.animationDelay=(Math.random()*0.5)+"s";
    d.style.animationDuration=(1.8+Math.random()*1.4)+"s";
    document.body.appendChild(d);
    setTimeout(()=>d.remove(),3800);
  }
}

function showResult(){
  const roundRight=queue.length-roundWrong.length;
  const wrongCount=roundWrong.length;
  const missing=total()-correct[sec].size;
  const roundPct=Math.round(roundRight/queue.length*100);
  app.innerHTML='<div class="result">'+
    '<p class="lbl">نتيجة الجولة</p>'+
    '<div class="ring" style="--p:'+roundPct+'"><div class="in"><span>'+roundRight+' / '+queue.length+'</span><small>الجولة</small></div></div>'+
    '<p class="muted">الاسكور الكلي للقسم: '+correct[sec].size+' / '+total()+'</p>'+
    '<div class="btns"></div></div>';
  const box=app.querySelector(".btns");
  if(wrongCount>0){
    const b=document.createElement("button");
    b.className="primary";
    b.textContent="إعادة الأسئلة الغلط ("+wrongCount+")";
    b.onclick=()=>startRound(roundWrong.slice());
    box.appendChild(b);
  }
  if(missing>0){
    const b=document.createElement("button");
    b.className=wrongCount>0?"ghost":"primary";
    b.textContent="إعادة القسم كامل";
    b.onclick=()=>startRound(SECTIONS[sec].items.map((_,k)=>k));
    box.appendChild(b);
  } else {
    const p=document.createElement("p");
    p.className="done";
    p.textContent="ممتاز! جاوبت على كل أسئلة القسم صح 🎉";
    box.appendChild(p);
  }
  const back=document.createElement("button");
  back.className="ghost";
  back.textContent="القائمة الرئيسية";
  back.onclick=showMenu;
  box.appendChild(back);
  const reset=document.createElement("button");
  reset.className="ghost";
  reset.textContent="صفّر اسكور القسم";
  reset.onclick=()=>{correct[sec].clear();startRound(SECTIONS[sec].items.map((_,k)=>k));};
  box.appendChild(reset);
  if(allDone()){app.querySelector(".result").insertAdjacentHTML("beforeend",overallHTML());}
  if(wrongCount===0||allDone()){confetti();}
  updateStats();
}

function render(){
  updateStats();
  if(pos>=queue.length){showResult();return;}
  answered=false;
  const qi=queue[pos],item=SECTIONS[sec].items[qi];
  const isTF=item.t==="tf";
  const options=isTF?["True","False"]:item.o;
  const correctIdx=isTF?(item.a?0:1):item.a;

  const wrap=document.createElement("div");
  wrap.className="qbox";
  wrap.innerHTML='<div class="meta"><span class="pill"></span><span class="pill"></span></div><div class="q"></div><div class="opts"></div><div class="actrow"><span class="fb"></span><button class="primary" disabled>التالي</button></div>';
  wrap.querySelectorAll(".pill")[0].textContent="السؤال "+(pos+1)+" من "+queue.length;
  wrap.querySelectorAll(".pill")[1].textContent=isTF?"True / False":"Multiple Choice";
  const qEl=wrap.querySelector(".q");
  if(item.h){qEl.innerHTML=item.h;}else{qEl.textContent=item.q;}
  const optsBox=wrap.querySelector(".opts");
  const fb=wrap.querySelector(".fb");
  const next=wrap.querySelector("button.primary");

  options.forEach((text,i)=>{
    const b=document.createElement("button");
    b.className="opt";
    b.style.setProperty("--d",(i*70+80)+"ms");
    const k=document.createElement("span");
    k.className="k";
    k.textContent=isTF?"":String.fromCharCode(65+i);
    if(isTF)k.style.display="none";
    const t=document.createElement("span");
    t.textContent=text;
    b.append(k,t);
    b.onclick=()=>{
      if(answered)return;
      answered=true;
      const btns=optsBox.querySelectorAll("button");
      btns.forEach(x=>x.disabled=true);
      if(i===correctIdx){
        b.classList.add("correct");
        correct[sec].add(qi);
        fb.textContent="🎉 إجابة صحيحة";
        fb.className="fb ok show";
      } else {
        b.classList.add("wrong");
        btns[correctIdx].classList.add("correct");
        if(!correct[sec].has(qi))roundWrong.push(qi);
        fb.textContent="❌ إجابة خاطئة";
        fb.className="fb bad show";
      }
      if(item.e){
        const ex=document.createElement("p");
        ex.className="expl";
        ex.textContent="Explanation: "+item.e;
        wrap.appendChild(ex);
      }
      updateStats();
      next.disabled=false;
    };
    optsBox.appendChild(b);
  });

  next.onclick=()=>{pos++;render();};
  app.innerHTML="";
  app.appendChild(wrap);
}

showMenu();
</script>
</body>
</html>
